[package]
name = "galaxy"
version = "0.1.0"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Your repos as a spiral galaxy: a star for each, sized by its code, coloured by its language, flaring on a commit. Part of the Fe2O3 suite, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/galaxy"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
glow = { version = "0.1.53", path = "../glow", package = "fe2o3-glow" }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
