<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a14"/>
    </linearGradient>
    <linearGradient id="rust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f74c00"/>
      <stop offset="100%" style="stop-color:#b7410e"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0%" style="stop-color:#fff4dc"/>
      <stop offset="35%" style="stop-color:#e8c79a;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e8c79a;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes flare { 0%,100% { opacity: 0; r: 4; } 30% { opacity: 1; } 80% { opacity: 0; r: 22; } }
    .fl { animation: flare 2.5s ease-out infinite; }
  </style>
  <circle cx="128" cy="128" r="120" fill="url(#bg)" stroke="url(#rust)" stroke-width="3"/>

  <!-- Two arms wound round the core -->
  <g fill="none" stroke="#8a90b8" stroke-width="10" stroke-linecap="round" opacity="0.22">
    <path d="M 128 128 C 150 108, 182 118, 188 150 C 194 186, 160 212, 118 208"/>
    <path d="M 128 128 C 106 148, 74 138, 68 106 C 62 70, 96 44, 138 48"/>
  </g>
  <circle cx="128" cy="128" r="40" fill="url(#core)"/>

  <!-- A star for each repo, coloured by its language -->
  <g fill="#f74c00">
    <circle cx="164" cy="117" r="4"/><circle cx="184" cy="138" r="5"/>
    <circle cx="187" cy="168" r="7"/><circle cx="166" cy="196" r="4"/>
    <circle cx="136" cy="207" r="6"/>
  </g>
  <g fill="#e8435a">
    <circle cx="92" cy="139" r="5"/><circle cx="72" cy="118" r="4"/><circle cx="71" cy="88" r="6"/>
  </g>
  <g fill="#5aa9ff">
    <circle cx="90" cy="60" r="5"/><circle cx="120" cy="49" r="4"/>
  </g>

  <!-- A new commit flares -->
  <g stroke="#ffd9a8" stroke-width="2" stroke-linecap="round">
    <path d="M 187 154 L 187 182 M 173 168 L 201 168"/>
  </g>
  <circle cx="187" cy="168" r="4" fill="none" stroke="#ffb066" stroke-width="2" class="fl"/>
</svg>
